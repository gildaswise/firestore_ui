name: firestore_ui
description: A port of firebase_database's FirebaseAnimatedList that works with cloud_firestore, with additional variants
version: 1.32.8
homepage: https://github.com/gildaswise/firestore_ui
# author: Gildásio Filho <gildasiogx@gmail.com>

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  firebase_core: ^4.0.0
  firebase_core_platform_interface: ^6.0.0
  cloud_firestore: ^6.0.0
  cloud_firestore_platform_interface: ^7.0.0
  collection: ^1.19.1
  flutter_staggered_grid_view: 0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

false_secrets:
  - /example/lib/firebase_options.dart
  - /example/android/app/google-services.json
  - /example/ios/Runner/GoogleService-Info.plist
